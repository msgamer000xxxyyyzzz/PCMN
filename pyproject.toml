[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcmn-prototype"
version = "0.6.0"
description = "PCMN experimental recurrent text LM, retrieval, agent tools and CPU/CUDA research backends"
requires-python = ">=3.10"
dependencies = ["torch>=2.3,<2.15", "numpy>=2.0,<3"]

[tool.setuptools.packages.find]
include = ["pcmn*"]
