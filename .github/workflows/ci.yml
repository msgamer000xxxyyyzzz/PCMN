name: CPU unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Configure native CPU scan
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build native CPU scan
        run: cmake --build native/build --config Release --parallel 2
      - name: Run Python unit tests including native scan
        run: python -m unittest discover -s tests -v
